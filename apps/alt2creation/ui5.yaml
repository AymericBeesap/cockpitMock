# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zlr.alt2creation
type: application
builder:
  resources:
    excludes:
      - /localService/**
      - /test/**
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.96.50
        backend:
          - path: /sap
            url: https://<hote-s4hana>:<port> # TODO
            client: "100" # TODO
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35735
        path: webapp
        delay: 300

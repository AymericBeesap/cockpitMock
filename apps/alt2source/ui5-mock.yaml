# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
#
# Le service du socle commun n'existe qu'une fois, dans apps/alt1source : les quatre
# applications des deux alternatives le consomment, à iso-données.

specVersion: "4.0"
metadata:
  name: zlr.alt2source
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.96.50
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35733
        path: webapp
        delay: 300
    - name: fiori-tools-servestatic
      afterMiddleware: compression
      configuration:
        paths:
          - path: /apps/sourcecommon
            src: ../sourcecommon
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZCRESASRC_CDS
            metadataPath: ../alt1source/webapp/localService/ZCRESASRC_CDS/metadata.xml
            mockdataPath: ../alt1source/webapp/localService/ZCRESASRC_CDS/data
            generateMockData: false
        annotations:
          - localPath: ../alt1source/webapp/localService/ZCRESASRC_CDS/annotations.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCRESASRC_CDS_VAN',Version='0001')/$value/

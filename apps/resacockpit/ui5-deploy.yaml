# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zovp.resacockpit
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: false
        target:
          url: https://<hote-s4hana>:<port> # TODO
          client: "100" # TODO
        app:
          name: ZOVP_RESACOCKP # nom de l'application BSP (15 caractères max.)
          description: Cockpit réservations magasin
          package: Z_RESA_COCKPIT # TODO : package de développement Z
          transport: <ordre-de-transport> # TODO
        exclude:
          - /test/

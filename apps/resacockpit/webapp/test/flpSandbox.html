<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit réservations magasin - Launchpad local</title>

    <script type="text/javascript">
        // Launchpad local : chaque entrée d'« applications » joue le rôle d'un target mapping.
        // Dans le Launchpad réel, ces mappings sont créés dans le catalogue Z du projet (§E2).
        // Les groupes de tuiles matérialisent les deux alternatives soumises à arbitrage.
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            bootstrapPlugins: {
                "RuntimeAuthoringPlugin": {
                    component: "sap.ushell.plugins.rta",
                    config: {
                        validateAppVersion: false
                    }
                }
            },
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            enableSearch: false,
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            services: {
                LaunchPage: {
                    adapter: {
                        config: {
                            groups: [
                                {
                                    id: "groupSuivi",
                                    title: "Suivi des réservations",
                                    isPreset: true,
                                    isVisible: true,
                                    isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileCockpit",
                                            title: "Cockpit réservations magasin",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Cockpit réservations magasin",
                                                subtitle: "Réservation, DA, commande",
                                                icon: "sap-icon://business-objects-experience",
                                                targetURL: "#ResaCockpit-display"
                                            }
                                        },
                                        {
                                            id: "tileTracking",
                                            title: "Suivi des réservations",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Suivi des réservations",
                                                subtitle: "Chaîne réservation - DA - commande",
                                                icon: "sap-icon://tree",
                                                targetURL: "#ResaChain-track"
                                            }
                                        },
                                        {
                                            id: "tileIdoc",
                                            title: "Monitoring des IDocs",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Monitoring des IDocs",
                                                subtitle: "Réservations en erreur",
                                                icon: "sap-icon://message-error",
                                                targetURL: "#ResaIdoc-monitor"
                                            }
                                        }
                                    ]
                                },
                                {
                                    id: "groupAlt1",
                                    title: "Alternative 1 - deux tuiles rationalisées",
                                    isPreset: true,
                                    isVisible: true,
                                    isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileAlt1Creation",
                                            title: "A1 - Créer une demande d'achat",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "A1 - Créer une demande d'achat",
                                                subtitle: "Besoin interne au centre",
                                                icon: "sap-icon://add-document",
                                                targetURL: "#ResaPurReq-create"
                                            }
                                        },
                                        {
                                            id: "tileAlt1Source",
                                            title: "A1 - Détermination de la source",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "A1 - Détermination de la source",
                                                subtitle: "Toutes les demandes d'achat",
                                                icon: "sap-icon://source-code",
                                                targetURL: "#ResaSource-determineAll"
                                            }
                                        }
                                    ]
                                },
                                {
                                    id: "groupAlt2",
                                    title: "Alternative 2 - split réappro / réservation",
                                    isPreset: true,
                                    isVisible: true,
                                    isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileAlt2Creation",
                                            title: "A2 - Commande de réapprovisionnement",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "A2 - Commande de réapprovisionnement",
                                                subtitle: "Source choisie à la création",
                                                icon: "sap-icon://cart-full",
                                                targetURL: "#ResaReplen-order"
                                            }
                                        },
                                        {
                                            id: "tileAlt2Source",
                                            title: "A2 - Réservations à approvisionner",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "A2 - Réservations à approvisionner",
                                                subtitle: "Dont commande petite caisse",
                                                icon: "sap-icon://retail-store",
                                                targetURL: "#ResaSource-determineResa"
                                            }
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                }
            },
            applications: {
                // ---- applications du projet : navigations opérationnelles
                "ResaCockpit-display": {
                    title: "Cockpit réservations magasin",
                    description: "Réservation, DA, commande d'achat",
                    additionalInformation: "SAPUI5.Component=zovp.resacockpit",
                    applicationType: "URL",
                    url: "../"
                },
                "ResaChain-track": {
                    title: "Suivi des réservations",
                    description: "Réservation, DA, commande",
                    additionalInformation: "SAPUI5.Component=zlr.resatracking",
                    applicationType: "URL",
                    url: "/apps/resatracking"
                },
                "ResaIdoc-monitor": {
                    title: "Monitoring des IDocs",
                    description: "Réservations magasin en erreur",
                    additionalInformation: "SAPUI5.Component=zlr.resaidoc",
                    applicationType: "URL",
                    url: "/apps/resaidoc"
                },

                // ---- Alternative 1 : rationalisation autour de deux tuiles
                "ResaPurReq-create": {
                    title: "A1 - Créer une demande d'achat",
                    description: "Besoin interne au centre",
                    additionalInformation: "SAPUI5.Component=zlr.alt1creation",
                    applicationType: "URL",
                    url: "/apps/alt1creation"
                },
                "ResaSource-determineAll": {
                    title: "A1 - Détermination de la source d'approvisionnement",
                    description: "Toutes les demandes d'achat",
                    additionalInformation: "SAPUI5.Component=zlr.alt1source",
                    applicationType: "URL",
                    url: "/apps/alt1source"
                },

                // ---- Alternative 2 : split conforme à l'attente métier et archi
                "ResaReplen-order": {
                    title: "A2 - Commande de réapprovisionnement",
                    description: "Source choisie à la création",
                    additionalInformation: "SAPUI5.Component=zlr.alt2creation",
                    applicationType: "URL",
                    url: "/apps/alt2creation"
                },
                "ResaSource-determineResa": {
                    title: "A2 - Réservations à approvisionner",
                    description: "Dont commande petite caisse",
                    additionalInformation: "SAPUI5.Component=zlr.alt2source",
                    applicationType: "URL",
                    url: "/apps/alt2source"
                },

                // ---- TODO NAVIGATION : cibles hors projet, à créer dans le Launchpad réel.
                // En local, elles ouvrent une page indiquant quoi configurer (navPlaceholder/targets.json).
                "PurchaseRequisition-displayFactSheet": {
                    title: "À configurer : fiche demande d'achat",
                    description: "Target mapping SAP (§D2)",
                    additionalInformation: "SAPUI5.Component=zresa.navplaceholder",
                    applicationType: "URL",
                    url: "./navPlaceholder"
                },
                "PurchaseOrder-displayFactSheet": {
                    title: "À configurer : fiche commande d'achat",
                    description: "Target mapping SAP (§D2)",
                    additionalInformation: "SAPUI5.Component=zresa.navplaceholder",
                    applicationType: "URL",
                    url: "./navPlaceholder"
                },
                "PurchaseRequisition-convertAuto": {
                    title: "À configurer : ME59N",
                    description: "Target mapping transaction (§D3)",
                    additionalInformation: "SAPUI5.Component=zresa.navplaceholder",
                    applicationType: "URL",
                    url: "./navPlaceholder"
                }
            }
        };
    </script>

    <script src="../test-resources/sap/ushell/bootstrap/sandbox.js" id="sap-ushell-bootstrap"></script>

    <script id="sap-ui-bootstrap"
        src="../resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell, sap.ovp, sap.ui.comp, sap.viz"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-language="fr"
        data-sap-ui-resourceroots='{"zovp.resacockpit": "../"}'
        data-sap-ui-frameOptions="allow"
        data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector", "layers": ["ALL"]}]'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRenderer().placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
